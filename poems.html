  <!-- ==========================================================
       TO ADD A POEM:
       Copy everything between the two lines of ===== below,
       paste it right underneath, and change the words.

       Start typing straight after the > and stop right before
       the closing p tag. Then just press Enter for a new line,
       like normal. The lines come out exactly as you type them.
       ========================================================== -->

  <article class="card">
    <h2>Thunder</h2>
    <p class="poem-text">The sky cleared its throat
and everybody in the house
looked up at the same time.

Even the dog,
who never looks up at anything.</p>
  </article>
