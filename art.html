  <!-- ==========================================================
       TO ADD A PICTURE:
       1. Put the picture file in the "images" folder.
       2. Copy one <figure> block below and paste it underneath.
       3. Change dragon.png to your file's name.
       4. Change the title and the little note under it.

       The alt="..." part describes the picture for people who
       can't see it. Say what's actually in the picture.
       ========================================================== -->

  <div class="gallery">

    <figure class="art">
      <img src="images/placeholder-1.svg" alt="Replace this with a description of your picture">
      <figcaption>
        My first picture
        <span>markers on paper</span>
      </figcaption>
    </figure>

    <figure class="art">
      <img src="images/placeholder-2.svg" alt="Replace this with a description of your picture">
      <figcaption>
        My second picture
        <span>colored pencil</span>
      </figcaption>
    </figure>

    <figure class="art">
      <img src="images/placeholder-3.svg" alt="Replace this with a description of your picture">
      <figcaption>
        My third picture
        <span>paint, and a bit of glitter</span>
      </figcaption>
    </figure>

  </div>

  <p class="footer">More art coming soon.</p>

</div>
